name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Deliberately unpinned, so CI tracks the latest Quarto and you can upgrade
      # locally whenever you like without the two drifting apart. What makes that
      # safe is html-math-method.url in _quarto.yml, which pins the MathJax version
      # explicitly instead of inheriting whatever the current Quarto happens to
      # inject, plus the wiring check below, which fails the build rather than
      # shipping silently broken math.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Render site
        run: quarto render

      # Rendering succeeds even when the math is completely broken, because a
      # duplicated or mismatched MathJax script is valid HTML. This is the step
      # that actually notices.
      - name: Check MathJax wiring
        run: python .github/scripts/check_math_wiring.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
