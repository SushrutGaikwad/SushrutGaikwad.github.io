format:
  html:
    # mainfont: "Source Sans 3"
    link-external-newwindow: true
    # Pin Quarto's own math injection to MathJax 3 (tex-chtml-FULL, which bundles the
    # physics and upgreek extensions the posts rely on). Do NOT also load MathJax from
    # include-in-header: two MathJax scripts on one page fight over window.MathJax and
    # nothing typesets. Quarto 1.10 switched its default to MathJax 4, which is what
    # broke the deployed site while the local Quarto 1.9 still shipped v3.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    theme:
      dark: darkly
      light: flatly
    # default-mode: dark
    # prefer-dark: true
    css: styles.css
    toc: true
    code-fold: true
    include-in-header:
      - text: |
          <!-- MathJax configuration. This must come BEFORE the MathJax script that
               Quarto injects (html-math-method above), because MathJax 3 reads
               window.MathJax at load time. include-in-header content is emitted
               ahead of Quarto's math dependency, so the ordering holds. -->
          <script>
            window.MathJax = {
              chtml: {
                // Emit CSS for all glyphs, not just those typeset on page load.
                // pseudocode.js renders algorithm blocks AFTER the initial MathJax
                // pass via tex2chtml; with the default adaptiveCSS:true, any glyph
                // not already present in the page body (e.g. an arrow in a post that
                // never uses one outside the algorithm) would render blank.
                adaptiveCSS: false
              },
              loader: {
                load: ['[tex]/physics', '[tex]/upgreek']
              },
              tex: {
                inlineMath: [['$','$'], ['\\(','\\)']],
                displayMath: [['$$','$$'], ['\\[','\\]']],
                processEscapes: true,
                processEnvironments: true,
                packages: {'[+]': ['physics', 'upgreek']}
              }
            };
          </script>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.css">
    include-after-body:
      - text: |
          <script src="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.js"></script>
          <script>
            document.addEventListener("DOMContentLoaded", function() {
              if (typeof MathJax !== 'undefined' && MathJax.startup) {
                MathJax.startup.promise.then(function() {
                  pseudocode.renderClass("pseudocode", { lineNumber: true });
                });
              } else {
                // Fallback: wait a bit for MathJax to load
                setTimeout(function() {
                  pseudocode.renderClass("pseudocode", { lineNumber: true });
                }, 1000);
              }
            });
          </script>

filters:
